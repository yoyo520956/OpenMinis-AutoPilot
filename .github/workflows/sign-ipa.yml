name: Re-sign IPA

# Manual re-sign of the latest (or a specific) unsigned build using the
# signing certificate stored in repository secrets. Produces a signed IPA
# that can be installed directly on the provisioned device(s).
#
# Required secrets (Settings → Secrets and variables → Actions):
#   SIGNING_P12_BASE64      — base64 of the .p12 certificate
#   SIGNING_P12_PASSWORD    — password of the .p12
#   SIGNING_PROFILE_BASE64  — base64 of the .mobileprovision

on:
  workflow_dispatch:
    inputs:
      base_run_id:
        description: 'build-ios.yml run ID to fetch the unsigned IPA from (empty = latest successful)'
        required: false
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  resign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch unsigned IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.base_run_id }}" ]; then
            RID="${{ inputs.base_run_id }}"
          else
            RID=$(gh run list --repo "${{ github.repository }}" --workflow build-ios.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "Using build run: $RID"
          gh run download "$RID" --repo "${{ github.repository }}" --name Minis-IPA-full --dir ./in
          ls -la ./in

      - name: Import signing identity
        env:
          P12_B64: ${{ secrets.SIGNING_P12_BASE64 }}
          PROFILE_B64: ${{ secrets.SIGNING_PROFILE_BASE64 }}
          P12_PASS: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_B64:-}" ]; then echo "✗ SIGNING_P12_BASE64 secret is not configured"; exit 1; fi
          if [ -z "${PROFILE_B64:-}" ]; then echo "✗ SIGNING_PROFILE_BASE64 secret is not configured"; exit 1; fi
          printf '%s\n' "$P12_B64" | openssl base64 -d > /tmp/cert.p12
          printf '%s\n' "$PROFILE_B64" | openssl base64 -d > /tmp/profile.mobileprovision
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain >/dev/null
          echo "── available identities ──"
          security find-identity -v -p codesigning build.keychain

      - name: Re-sign IPA
        run: |
          set -euo pipefail
          IPA=$(ls ./in/*.ipa | head -1)
          echo "unsigned IPA: $IPA"
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/iPhone Distribution|Apple Distribution/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then echo "✗ no signing identity found in keychain"; exit 1; fi
          echo "identity: $IDENTITY"
          bash tools/sign-ipa.sh "$IPA" "$IDENTITY" /tmp/profile.mobileprovision ./Minis-AutoPilot-signed.ipa

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: Minis-IPA-signed
          path: ./Minis-AutoPilot-signed.ipa
          if-no-files-found: error
