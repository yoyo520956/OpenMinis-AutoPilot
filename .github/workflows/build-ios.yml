name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'deps/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install Homebrew dependencies
        run: brew install ninja llvm libarchive pkg-config go lld

      - name: Install meson
        run: brew install meson

      - name: Download Metal toolchain (for FFmpeg yadif_videotoolbox)
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Prepare build-time config templates
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: "Native deps 1/5: LAME"
        run: bash deps/build_lame.sh

      - name: "Native deps 2/5: FFmpeg"
        run: bash deps/build_ffmpeg.sh

      - name: Wire lld into the llvm toolchain (iSH VDSO needs -fuse-ld=lld)
        run: |
          LLD="$(brew --prefix lld)"
          LLVM="$(brew --prefix llvm)"
          ln -sf "$LLD/bin/ld.lld" "$LLVM/bin/ld.lld"
          echo "$LLD/bin" >> "$GITHUB_PATH"

      - name: "Native deps 3/5: iSH kernel"
        run: bash deps/build_ish.sh

      - name: "Native deps 4/5: Alpine rootfs"
        run: bash deps/prepare_alpine_rootfs.sh

      - name: "Native deps 5/5: rclone"
        run: bash deps/build_rclone_ios.sh

      - name: Build app (unsigned — SDK 26.5 disallows ad-hoc signing)
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry Minis-AutoPilot-unsigned.ipa Payload
          ls -la Minis-AutoPilot-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-IPA
          path: Minis-AutoPilot-unsigned.ipa
          if-no-files-found: error
